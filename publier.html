<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier un Travail - TFC RDC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="p-4">
        <a href="index.html" class="text-blue-600 font-semibold flex items-center">
            ← Retour à la bibliothèque
        </a>
    </div>

    <main class="container mx-auto max-w-2xl px-4 py-8">
        <div class="bg-white shadow-xl rounded-2xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 border-b pb-4 mb-6">Soumettre votre travail</h2>
            
            <form id="tfcForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nom et Postnom de l'auteur</label>
                    <input type="text" required class="mt-1 block w-full p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Titre complet du TFC / Mémoire</label>
                    <input type="text" required class="mt-1 block w-full p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Université / Institution</label>
                    <input type="text" value="Université de Malemba Nkulu" required class="mt-1 block w-full p-3 border border-gray-300 bg-gray-50 rounded-md">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Niveau d'étude</label>
                        <select class="mt-1 block w-full p-3 border border-gray-300 rounded-md">
                            <option>Licence</option>
                            <option>Master</option>
                            <option>Doctorat</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Année Académique</label>
                        <input type="text" placeholder="Ex: 2024-2025" class="mt-1 block w-full p-3 border border-gray-300 rounded-md">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Résumé (Abstract)</label>
                    <textarea rows="4" class="mt-1 block w-full p-3 border border-gray-300 rounded-md" placeholder="De quoi parle votre recherche ?"></textarea>
                </div>

                <div class="bg-blue-50 p-4 border-2 border-dashed border-blue-200 rounded-lg text-center">
                    <label class="block text-sm font-medium text-blue-800 mb-2">Charger le document (PDF)</label>
                    <input type="file" accept=".pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                </div>

                <button type="submit" class="w-full bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-900 transition duration-300">
                    🚀 Envoyer pour validation
                </button>
            </form>
        </div>
    </main>

</body>
</html>
